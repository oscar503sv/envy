[advisories]
version = 2
unmaintained = "all"
yanked = "deny"

[licenses]
version = 2
allow = [
    "Apache-2.0", # Alternative license used by thiserror and the proc-macro dependencies.
    "GPL-3.0-or-later", # License of the workspace crate.
    "MIT", # Permissive license used by thiserror and the proc-macro dependencies.
    "Unicode-3.0", # Required by unicode-ident.
]

# Build dependency of system-deps, pulled in by the GLib -sys crates.
[[licenses.exceptions]]
crate = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The self dev-dependency that enables `test-support` is a path dependency.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
