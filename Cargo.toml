[package]
name = "envy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
description = "Safe, native GNOME editor for dotenv files"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
string_slice = "deny"
indexing_slicing = "deny"

[features]
test-support = []

[dependencies]
gio = { version = "0.22", features = ["v2_66"] }
libc = "0.2"
sha2 = { version = "0.11", default-features = false }
thiserror = "2"

[dev-dependencies]
envy = { path = ".", features = ["test-support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
